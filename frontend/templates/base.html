<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}VulnerablePortal{% endblock %}</title>

    <link rel="stylesheet" href="/css/tailwind.css" />

    {% block head %}{% endblock %}
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-800">
    <!-- Navigation -->
    <header class="bg-slate-900 text-white shadow-lg">
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5"
      >
        <a href="/" class="text-2xl font-bold tracking-tight">
          Vulnerable
          <span class="text-blue-400">Portal</span>
        </a>

        <nav class="flex items-center gap-6 text-sm font-medium">
          <a href="/" class="text-slate-300 transition hover:text-white">
            Home
          </a>

          <a
            href="/comments"
            class="text-slate-300 transition hover:text-white"
          >
            Comments
          </a>

          <a href="/login" class="text-slate-300 transition hover:text-white">
            Login
          </a>

          <a
            href="/register"
            class="rounded-lg bg-blue-600 px-4 py-2 text-white transition hover:bg-blue-500"
          >
            Register
          </a>
        </nav>
      </div>
    </header>

    <!-- Individual Page Content -->
    <main>{% block content %}{% endblock %}</main>

    {% block scripts %}{% endblock %}
  </body>
</html>

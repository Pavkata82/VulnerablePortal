{% extends "base.html" %} {% block title %}Login - VulnerablePortal{% endblock
%} {% block content %}

<section
  class="flex min-h-[calc(100vh-76px)] items-center justify-center px-6 py-12"
>
  <div class="w-full max-w-md">
    <!-- Heading -->
    <div class="mb-8 text-center">
      <div
        class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-100 text-2xl font-bold text-blue-600"
      >
        →
      </div>

      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        Welcome Back
      </h1>

      <p class="mt-2 text-sm text-slate-500">Sign in to access your account.</p>
    </div>

    <!-- Login Card -->
    <div
      class="rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/50"
    >
      <div id="message" class="mb-5 text-sm"></div>

      <form id="login-form" onsubmit="loginUser(event)" class="space-y-5">
        <!-- Username -->
        <div>
          <label
            for="username"
            class="mb-2 block text-sm font-semibold text-slate-700"
          >
            Username
          </label>

          <input
            type="text"
            id="username"
            placeholder="Enter your username"
            required
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <!-- Password -->
        <div>
          <label
            for="password"
            class="mb-2 block text-sm font-semibold text-slate-700"
          >
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white shadow-md shadow-blue-600/20 transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200"
        >
          Login
        </button>
      </form>

      <!-- Register Link -->
      <p class="mt-6 text-center text-sm text-slate-500">
        Don't have an account?

        <a
          href="/register"
          class="font-semibold text-blue-600 hover:text-blue-700"
        >
          Create an account
        </a>
      </p>
    </div>
  </div>
</section>

{% endblock %} {% block scripts %}
<script src="/js/auth.js"></script>
{% endblock %} ```

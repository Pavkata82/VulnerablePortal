{% extends "base.html" %} {% block title %}Register - VulnerablePortal{%
endblock %} {% block content %}

<section
  class="flex min-h-[calc(100vh-76px)] items-center justify-center px-6 py-12"
>
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        Create an Account
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Register to access VulnerablePortal.
      </p>
    </div>

    <div
      class="rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/50"
    >
      <div id="message" class="mb-5 text-sm"></div>

      <form id="register-form" onsubmit="registerUser(event)" class="space-y-5">
        <div>
          <label
            for="username"
            class="mb-2 block text-sm font-semibold text-slate-700"
          >
            Username
          </label>

          <input
            type="text"
            id="username"
            placeholder="Enter your username"
            required
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <div>
          <label
            for="password"
            class="mb-2 block text-sm font-semibold text-slate-700"
          >
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <button
          type="submit"
          class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200"
        >
          Create Account
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account?
        <a
          href="/login"
          class="font-semibold text-blue-600 hover:text-blue-700"
        >
          Login here
        </a>
      </p>
    </div>
  </div>
</section>

{% endblock %} {% block scripts %}
<script src="/js/auth.js"></script>
{% endblock %}

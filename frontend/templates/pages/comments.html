{% extends "base.html" %} {% block title %}Dashboard - VulnerablePortal{%
endblock %} {% block content %}

<section class="min-h-[calc(100vh-76px)] px-6 py-12">
  <div class="mx-auto max-w-6xl">
    <!-- Dashboard Heading -->
    <div class="mb-10 flex w-full items-start justify-between gap-4">
      <div>
        <p class="text-2xl font-semibold text-blue-600">Comments</p>
        <p class="mt-2 text-slate-500">See all comments on the website</p>
      </div>

      <a
        href="/add_comment"
        class="inline-flex h-fit shrink-0 items-center rounded-lg bg-blue-600 px-4 py-2 text-white transition hover:bg-blue-500"
      >
        Add Comment
      </a>
    </div>

    <!-- Comments Information -->
    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
      <h2 class="text-xl font-bold text-slate-900">Comments Information</h2>

      <p class="mt-1 text-sm text-slate-500">Website comments</p>

      <!-- Messages -->
      <div id="message" class="mt-5 text-sm"></div>

      <!-- Comments Container -->
      <div id="comments-content" class="mt-8 grid gap-6 sm:grid-cols-2">
        <p class="text-slate-500">Loading comments...</p>
      </div>
    </div>
  </div>
</section>

{% endblock %} {% block scripts %}
<script src="/js/comments.js"></script>
{% endblock %}
